<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>我的周邊收藏櫃</title>
<style>
:root{--bg:#EDF1EF;--card:#FFFFFF;--ink:#1D2238;--muted:#5D647A;--line:#D3DAD6;--pink:#E83E73;--on:#FFFFFF;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#14172A;--card:#1E2238;--ink:#ECEFF8;--muted:#A4AAC3;--line:#353B5E;--pink:#FF6E98;--on:#14172A;color-scheme:dark}}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;display:grid;place-items:center;padding:20px}
.box{width:min(360px,100%);background:var(--card);border-radius:20px;padding:28px 24px;box-shadow:0 10px 30px -18px rgba(0,0,0,.5)}
h1{margin:0 0 4px;font-size:22px}
p{margin:0 0 18px;color:var(--muted);font-size:14px}
input[type=password],input[type=text]{width:100%;font:inherit;font-size:16px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:2.5px solid var(--pink);outline-offset:2px}
.row{display:flex;justify-content:space-between;align-items:center;margin:12px 0 18px;font-size:14px;color:var(--muted)}
.row label{display:flex;gap:6px;align-items:center;cursor:pointer}
button{width:100%;font:inherit;font-weight:700;font-size:16px;padding:12px;border:0;border-radius:12px;background:var(--pink);color:var(--on);cursor:pointer}
button:disabled{opacity:.6}
.link{width:auto;background:none;color:var(--pink);padding:0;font-weight:500;font-size:14px}
.err{color:var(--pink);font-size:14px;margin:12px 0 0;min-height:1.4em}
[hidden]{display:none!important}
</style>
</head>
<body>
<main class="box" id="box" hidden>
  <h1>我的周邊收藏櫃</h1>
  <p>輸入密碼才能打開。</p>
  <form id="f" novalidate>
    <input type="password" id="pw" autocomplete="current-password" aria-label="密碼" placeholder="密碼">
    <div class="row">
      <label><input type="checkbox" id="rm" checked>記住這台裝置</label>
      <button type="button" class="link" id="show">顯示密碼</button>
    </div>
    <button type="submit" id="go">打開</button>
    <p class="err" id="err" role="alert"></p>
  </form>
</main>

  function b64(s){ var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
  function tob64(buf){ var a = new Uint8Array(buf), s = ""; for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]); return btoa(s); }

  }
  function write(html){ document.open(); document.write(html); document.close(); }
